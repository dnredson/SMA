# SmartAdapter configuration for Magistrala + Atom.
# Keep runtime credentials in environment variables, not in this file.

atom_url = "http://localhost:8080"
atom_graphql_url = "http://localhost:8080/graphql"
atom_tenant_id = "replace-with-atom-tenant-id"
atom_channel_id = "replace-with-atom-channel-id"
atom_manage_policies = true
atom_timeout_ms = 10000

# FluxMQ HTTP adapter. The modern route is:
# POST /<tenant_id>/channels/<channel_id>/messages
http_adapter_url = "http://localhost:8008"
publish_timeout_ms = 5000

mqtt_address = "tcp://127.0.0.1:1883"
mqtt_topics = ["#"]

api_host = "127.0.0.1"
api_port = 8081
# Set api_token or ADAPTER_API_TOKEN to protect the CRUD API.
api_token = ""

entities_json_path = "./entities.json"
master_key_file = "./adapter.key"
log_level = "info"
log_file = ""
senml_max_batch = 100
batch_flush_ms = 200
max_retries = 3
retry_backoff_ms = 200
ul_bt_accept_seconds = 600

quality_enable = true
quality_alerts_enable = true
alerts_mqtt_address = "tcp://127.0.0.1:1883"
mqtt_alert_topic_base = "adapter/alerts"
mqtt_alert_qos = 0
quality_thresholds_json = '''
{
  "rel.humidity":        {"min": 0.0,  "max": 1.0},
  "battery.level":       {"min": 0.0,  "max": 100.0},
  "soil.raw.moisture_*": {"min": 0.0,  "max": 2500.0},
  "soil.raw.ec_*":       {"min": 0.0,  "max": 2500.0},
  "soil.raw.temp_*":     {"min": -25.0, "max": 100.0}
}
'''
